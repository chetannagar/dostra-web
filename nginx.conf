# Nginx config for the Dostra CRM frontend (production).
#
# This config is used inside the web container only — it serves the pre-built
# Vite static assets. It is NOT the reverse proxy config (that lives in nginx/
# at the repo root and sits in front of both the web and api containers).
#
# Key responsibilities:
# - serve static files from /usr/share/nginx/html
# - fall back to index.html for all unknown paths (React client-side routing)
# - set cache headers: long TTL for hashed assets, no cache for index.html
# - return gzipped responses where supported

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for text assets.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Static assets built by Vite have content hashes in their filenames
    # (e.g. main.a1b2c3d4.js). Cache them aggressively — a new deploy produces
    # new filenames so there is no stale-cache risk.
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached so the browser always fetches the latest
    # shell on deploy, which then loads the correctly hashed asset filenames.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback: any path that does not match a real file is served as
    # index.html so the React router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
